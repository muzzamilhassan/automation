name: SecretCheck
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: lengths
        env:
          G: ${{ secrets.LONGVIDEO_GEMINI_API_KEY }}
          Q: ${{ secrets.LONGVIDEO_GROQ_API_KEY }}
          P: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "gemini=${#G} groq=${#Q} pexels=${#P}"
