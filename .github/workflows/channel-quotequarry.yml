name: 📺 Quote Quarry — Full Pipeline

on:
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:
    inputs:
      topup:
        description: "heal N slots (blank = normal daily run)"
        required: false
        default: ""

concurrency:
  group: channel-quotequarry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    name: 🏭 Quote Quarry — Shorts + FB (IG = slot poster)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines (edge-tts + Kokoro-82M)
        run: |
          python3 -m pip install --quiet edge-tts kokoro-onnx soundfile || true
          python3 -c "import edge_tts; print('edge-tts ready.')"
          python3 -c "import kokoro_onnx; print('kokoro ready.')" || echo "kokoro unavailable — edge fallback."

      - name: 🎨 Start Image & Video Engine
        run: |
          node image-tools/server.js &
          sleep 3

      - name: 🚀 Channel Pipeline — Shorts + FB Reels + IG Reels + Posters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_QUOTEQUARRY: ${{ secrets.YT_TOKEN_QUOTEQUARRY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node channel-pipeline.mjs quotequarry ${{ inputs.topup && format('--topup={0}', inputs.topup) || '' }}
      - name: 📦 Keep reels for IG slot poster
        if: ${{ hashFiles('fb-outbox/quotequarry/*.json*') != '' }}
        uses: actions/cache/save@v4
        with:
          path: fb-outbox/quotequarry
          key: ig-outbox-quotequarry-${{ github.run_id }}

      - name: 📦 Stage doc render for TikTok clips (docDay only)
        if: always()
        run: |
          mkdir -p tt-lf
          if [ -f demos/deepdive-quotequarry/episode.mp4 ]; then
            cp demos/deepdive-quotequarry/episode.mp4 tt-lf/lf-quotequarry.mp4
            TITLE=$(node -e "
              const fs=require('fs');
              try{
                const files=fs.readdirSync('fb-outbox/quotequarry').filter(f=>f.endsWith('.json'));
                for(const f of files.reverse()){
                  const j=JSON.parse(fs.readFileSync('fb-outbox/quotequarry/'+f,'utf8'));
                  if(j.kind==='episode'&&j.title){console.log(j.title);return;}
                }
              }catch(e){}
              console.log('Quote Quarry documentary');
            ")
            node -e "require('fs').writeFileSync('tt-lf/lf-meta-quotequarry.json',JSON.stringify({title:process.argv[1],keyword:'stoic wisdom'},null,2))" "$TITLE"
            echo "staged doc render: $TITLE"
          else
            echo "no doc rendered today (not docDay) — nothing to archive"
          fi

      - name: ⬆️ Upload doc render artifact
        if: ${{ hashFiles('tt-lf/lf-quotequarry.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lf-quotequarry
          path: tt-lf/lf-quotequarry.mp4
          retention-days: 30

      - name: ⬆️ Upload doc meta artifact
        if: ${{ hashFiles('tt-lf/lf-meta-quotequarry.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lf-meta-quotequarry
          path: tt-lf/lf-meta-quotequarry.json
          retention-days: 30

      - name: 💾 Commit publishing state
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/state/ yt-mcp/schedule-state.json yt-mcp/trends-*.json || true
          git diff --cached --quiet || git commit -m "quotequarry daily state [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || true || echo "::warning::state push failed for quotequarry — state stays local to this run"
