name: 📺 Investor's Compass — Full Pipeline

on:
  schedule:
    # Staggered: this channel's production window
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      recycle_test:
        description: 'Run one recycle instead of the pipeline (test mode)'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: channel-investors-compass
  cancel-in-progress: false

jobs:
  produce:
    name: 🏭 Investor's Compass — Shorts + FB (IG = slot poster)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines (edge-tts + Kokoro-82M)
        run: |
          python3 -m pip install --quiet edge-tts kokoro-onnx soundfile || true
          python3 -c "import edge_tts; print('edge-tts ready.')"
          python3 -c "import kokoro_onnx; print('kokoro ready.')" || echo "kokoro unavailable — edge fallback."

      - name: 🎨 Start Image & Video Engine
        run: |
          node image-tools/server.js &
          sleep 3

      - name: 📥 Install yt-dlp (recycle downloads)
        run: python3 -m pip install --quiet yt-dlp || pip install --quiet yt-dlp || true

      - name: 🍪 Restore yt-dlp cookies (optional)
        env:
          YT_DLP_COOKIES: ${{ secrets.YT_DLP_COOKIES }}
        run: |
          if [ -n "$YT_DLP_COOKIES" ]; then
            printf '%s' "$YT_DLP_COOKIES" > /tmp/yt-cookies.txt
            echo "cookies restored — recycle downloads will use them"
          else
            echo "no cookies secret — recycle downloads try client fallbacks only"
          fi

      - name: 🚀 Channel Pipeline — Shorts + FB Reels + IG Reels + Posters
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YT_DLP_COOKIES: /tmp/yt-cookies.txt
        run: |
          if [ "${{ inputs.recycle_test }}" = "true" ]; then
            node yt-recycle.mjs investors-compass
          else
            node channel-pipeline.mjs investors-compass --no-episode
          fi

      - name: 📦 Keep reels for IG slot poster
        if: ${{ hashFiles('fb-outbox/investors-compass/*.json*') != '' }}
        uses: actions/cache/save@v4
        with:
          path: fb-outbox/investors-compass
          key: ig-outbox-investors-compass-${{ github.run_id }}

      - name: 💾 Commit publishing state
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/schedule-state.json yt-mcp/trends-*.json || true
          git diff --cached --quiet || git commit -m "investors-compass daily state [skip ci]"
          git push || true
