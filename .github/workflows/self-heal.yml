name: 🔄 Self-Heal — Auto-Fix Failed Workflows

on:
  workflow_run:
    workflows:
      - "🚀 Autonomous Multi-Brand Content Engine"
    types: [completed]

concurrency:
  group: self-heal
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  heal:
    name: 🔍 Detect Failure & Create Auto-Issue
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 5
    steps:
      - name: 📝 Create Issue with Error Details
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `🔄 Self-Heal: ${run.name} failed`;
            const body = [
              '## Auto-Detected Failure',
              '',
              `**Workflow:** ${run.name}`,
              `**Run ID:** ${run.id}`,
              `**Time:** ${new Date().toISOString()}`,
              `**URL:** ${run.html_url}`,
              '',
              '### Known Fixes Already Applied',
              '- ✅ .env reads guarded',
              '- ✅ OAuth creds env-first',
              '- ✅ Token resolution env-first',
              '- ✅ ffprobe resolution fixed',
              '- ✅ Groq/Cerebras/Mistral wired',
              '',
              '### If this is a NEW issue',
              'Check the [failed run logs](' + run.html_url + ') for details.'
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['auto-detected', 'ci-failure']
            });
