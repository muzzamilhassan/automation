name: 📼 Weekly Long-Form Compilation (watch-hours engine)

on:
  schedule:
    # Sunday 14:00 UTC = 19:00 PKT Sunday evening + 10am US East — prime
    # long-form day (Buffer 2026: Sunday is the top long-form day).
    - cron: '0 14 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-compilation
  cancel-in-progress: false

jobs:
  compile:
    name: 🎬 Build & Upload Weekly Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install Edge-TTS (narration fallback)
        run: |
          python3 -m pip install --quiet --user edge-tts || pip install --quiet edge-tts || true
          python3 -c "import edge_tts; print('Edge-TTS ready.')" || echo "Edge-TTS unavailable."

      - name: 📼 Build & Upload Weekly Compilation
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node weekly-compilation.mjs

      - name: 🖼️ Upload Compilation Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-compilation-${{ github.run_id }}
          path: |
            compilation-week.mp4
            yt-compilation-test.mp4
          if-no-files-found: ignore
          retention-days: 7
