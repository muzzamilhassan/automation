name: "🛠️ Daily Sweeper — self-healing, re-runs anything missing"

on:
  schedule:
    # 20:15 UTC = 01:15 PKT — after all 3 content slots had their chance
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, heal nothing)'
        default: false
        type: boolean

concurrency:
  group: sweeper
  cancel-in-progress: false

# State commits below need write access (default-token restrictions would silently break them — see issue #70)
permissions:
  contents: write

jobs:
  discover:
    # #106 T4b: the sweep itself stays ONE job (sweeper.mjs loops the registry
    # itself — a matrix here would multiply every heal); the registry read
    # drives the per-slug cache HANDOFF below.
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry
        id: disc
        run: |
          node -e "
            const fs = require('fs');
            let chans = [];
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              chans = (reg.channels || [])
                .filter(c => c.slug && c.active !== false)
                .map(c => ({
                  slug: c.slug,
                  envSlug: c.slug.toUpperCase().replace(/-/g, '_')
                }));
            } catch (e) { console.log('::error::registry unreadable (no channel selected): ' + (e.message || e)); }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔊 Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines
        run: |
          python3 -m pip install --quiet --user edge-tts kokoro-onnx || pip install --quiet edge-tts kokoro-onnx || true
          curl -sL --retry 3 -o pixabay-pool/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" || true
          curl -sL --retry 3 -o pixabay-pool/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" || true

      - name: 🛠️ Sweep & heal
        # Heal split (T4b fix round 1): the YT_TOKEN_* env lines below are the
        # LEGACY fleet's in-process heal tokens — a single job cannot construct
        # secret names (secrets[format(...)] needs a matrix). A registry
        # channel without a mapped token is healed by sweeper.mjs dispatching
        # channel-autopilot.yml (channel=<slug>, topup=1 — its matrix resolves
        # the channel's own secret), deduped to one dispatch per channel/day.
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.SECRET_WRITER_PAT }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }} #120: vault v2 — CI loader needs the master key
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_TOKEN_QUOTEQUARRY: ${{ secrets.YT_TOKEN_QUOTEQUARRY }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          YT_TOKEN_MONEY_RULEBOOK: ${{ secrets.YT_TOKEN_MONEY_RULEBOOK }}
          YT_TOKEN_DEBT_FREE_DOCTRINE: ${{ secrets.YT_TOKEN_DEBT_FREE_DOCTRINE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node sweeper.mjs --dry-run
          else
            node sweeper.mjs
          fi

      - name: 📦 Hand healed reels to the per-slug cache save (matrix job below)
        # T4b: this REPLACES the four hardcoded per-slug save steps. One
        # artifact of everything the heal produced; the handoff matrix then
        # writes each slug's cache with the exact keys the drain lanes
        # restore (ig-outbox-<slug>-sweep-<run_id>). No heal today = no
        # artifact = no saves (same as the hash-gated steps it replaced).
        if: ${{ hashFiles('fb-outbox/**/*.json*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: healed-outbox
          path: fb-outbox
          retention-days: 1
          if-no-files-found: ignore

      - name: 💾 Commit logs back
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add logs/ state/ yt-mcp/state/ yt-mcp/schedule-state.json || true
          git diff --cached --quiet || git commit -m "sweeper log: $(date -u +%F)"
          git push || true

  handoff:
    name: 📦 Keep healed reels for IG slot poster (${{ matrix.slug.slug }})
    needs: [discover, sweep]
    if: ${{ always() && needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 4
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Download the healed outbox (missing = nothing was healed today)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: healed-outbox
          path: healed-outbox

      - name: 🗂️ Restore the outbox layout
        run: |
          mkdir -p fb-outbox
          if [ -d healed-outbox/fb-outbox ]; then
            cp -a healed-outbox/fb-outbox/. fb-outbox/
          else
            cp -a healed-outbox/. fb-outbox/ 2>/dev/null || true
          fi

      - name: 💾 Keep healed reels for IG slot poster
        if: ${{ hashFiles(format('fb-outbox/{0}/*.json*', matrix.slug.slug)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: fb-outbox/${{ matrix.slug.slug }}
          key: ig-outbox-${{ matrix.slug.slug }}-sweep-${{ github.run_id }}
