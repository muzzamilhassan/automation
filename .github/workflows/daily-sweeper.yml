name: 🛠️ Daily Sweeper (self-healing: re-runs anything missing)

on:
  schedule:
    # 20:15 UTC = 01:15 PKT — after all 3 content slots had their chance
    - cron: '15 20 * * *'
  workflow_dispatch:

concurrency:
  group: sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔊 Install FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines
        run: |
          python3 -m pip install --quiet --user edge-tts kokoro-onnx || pip install --quiet edge-tts kokoro-onnx || true
          curl -sL --retry 3 -o pixabay-pool/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" || true
          curl -sL --retry 3 -o pixabay-pool/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" || true

      - name: 🛠️ Sweep & heal
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.SECRET_WRITER_PAT }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node sweeper.mjs

      - name: 💾 Commit logs back
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add logs/ state/ || true
          git diff --cached --quiet || git commit -m "sweeper log: $(date -u +%F)"
          git push || true
