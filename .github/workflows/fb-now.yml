# Studio Buttons — manual FB runs from the Quarry Studio dashboard (or Actions tab).
# reels   = drain queued FB reels from the channel-workflow outbox caches
# posters = daily niche poster images per FB page
# Everything else (shorts, episodes, IG slots) has its own workflow — this file
# only exists for the two FB scripts that had no cloud home.
#
# #106 T4b: ONE matrix job per ACTIVE registry channel (discover step reads
# yt-mcp/studio-channels.json — the channel-autopilot.yml pattern). New
# channels join automatically; a job whose fb-outbox/<slug> cache misses is a
# harmless no-op. The drain scripts scan fb-outbox/ and only ever see the one
# slug dir this job restored, so per-channel behavior is unchanged. Scope:
# the DRAIN only — the static FB page maps inside fb-crosspost.mjs /
# fb-images.mjs are the social-lane's (T4c) to retire from registry data.
name: 🎛️ Studio — FB now

on:
  workflow_dispatch:
    inputs:
      job:
        description: "reels | posters"
        required: true
        default: "reels"

# State commits below need write access (default-token restrictions would silently break them — see issue #70)
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry
        id: disc
        run: |
          node -e "
            const fs = require('fs');
            let chans = [];
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              chans = (reg.channels || [])
                .filter(c => c.slug && c.active !== false)
                .map(c => ({
                  slug: c.slug,
                  envSlug: c.slug.toUpperCase().replace(/-/g, '_')
                }));
            } catch (e) { console.log('::error::registry unreadable (no channel selected): ' + (e.message || e)); }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  run:
    name: 🎛️ ${{ inputs.job }} — ${{ matrix.slug.slug }}
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 3
      fail-fast: false
    concurrency:
      #63: same-slug drains serialize across BOTH drain workflows (this one and
      # ig-slot-poster share the group name — no workflow dimension). Parallel
      # same-slug runs overwrote each other's outbox cache, resurrecting posted
      # reels. Drains restore-only and never re-save, and different slugs have
      # disjoint cache paths, so cross-slug jobs parallelize safely.
      group: crosspost-${{ matrix.slug.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: ${{ matrix.slug.slug }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: ♻️ Restore queued reels for ${{ matrix.slug.slug }}
        uses: actions/cache@v4
        with:
          path: fb-outbox/${{ matrix.slug.slug }}
          key: ig-outbox-${{ matrix.slug.slug }}-${{ github.run_id }}
          restore-keys: ig-outbox-${{ matrix.slug.slug }}-

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔊 Install FFmpeg (posters render video-style frames)
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 📤 FB reels — drain outbox
        if: ${{ inputs.job == 'reels' }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node fb-crosspost.mjs

      - name: 🖼️ FB posters — daily niche image for this page
        if: ${{ inputs.job == 'posters' }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }} #120: vault v2 — CI loader needs the master key
        run: node fb-images.mjs "$SLUG"

      - name: 💾 Commit publishing state
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/schedule-state.json yt-mcp/state/ || true
          git diff --cached --quiet || git commit -m "fb-now state [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || true
