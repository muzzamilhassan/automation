name: 🎬 Long-Form Flow — Daily Episodes (4 channels → YT → FB → IG)

on:
  schedule:
    # 11:10 UTC daily — produces each channel's premium episode
    - cron: '10 11 * * *'
  workflow_dispatch:

concurrency:
  group: long-form
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episodes:
    name: 🎥 Episodes — IC/MR/DFD/QQ → YouTube + FB + IG
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines (edge-tts + Kokoro-82M)
        run: |
          python3 -m pip install --quiet edge-tts kokoro-onnx soundfile || true
          python3 -c "import edge_tts; print('edge-tts ready.')"
          python3 -c "import kokoro_onnx; print('kokoro ready.')" || echo "kokoro unavailable — edge fallback."

      - name: 🎨 Start Image & Video Engine
        run: |
          node image-tools/server.js &
          sleep 3

      - name: 🎥 Produce — 4 daily episodes → YouTube + FB/IG outbox
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          YT_TOKEN_MONEY_RULEBOOK: ${{ secrets.YT_TOKEN_MONEY_RULEBOOK }}
          YT_TOKEN_DEBT_FREE_DOCTRINE: ${{ secrets.YT_TOKEN_DEBT_FREE_DOCTRINE }}
          YT_TOKEN_QUOTEQUARRY: ${{ secrets.YT_TOKEN_QUOTEQUARRY }}
        run: |
          node yt-daily.mjs investors-compass --episode-only
          node yt-daily.mjs money-rulebook --episode-only
          node yt-daily.mjs debt-free-doctrine --episode-only
          node yt-deepdive.mjs quotequarry

      - name: 📣 Distribute episodes to Facebook + Instagram
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          node fb-crosspost.mjs
          node ig-crosspost.mjs

      - name: 💾 Commit publishing state back
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/schedule-state.json yt-mcp/trends-*.json || true
          git diff --cached --quiet || git commit -m "long-form daily state [skip ci]"
          git push
