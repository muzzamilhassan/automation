name: 📊 Daily/Weekly/Monthly Reports (Excel + ntfy)

# #106 T4b: reporting is registry-driven — ONE matrix job per ACTIVE registry
# channel fetches that channel's numbers with its OWN YT_TOKEN_<ENSSLUG>
# secret (the channel-autopilot.yml dynamic-secret pattern — the only way to
# map secret names from a registry; a single job cannot construct secret
# names), writing a fragment JSON artifact. The collect job then merges the
# fragments into the SAME daily workbook, ntfy push, state commit and
# artifacts as before. A channel with a missing/dead token GAPs its rows —
# it never kills the report for the others.

on:
  schedule:
    # 16:45 UTC = 21:45 PKT — after all three posting slots have run
    - cron: '45 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Report mode'
        default: 'daily'
        type: choice
        options: ['daily', 'weekly', 'monthly']

concurrency:
  group: reporting
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry
        id: disc
        run: |
          node -e "
            const fs = require('fs');
            let chans = [];
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              chans = (reg.channels || [])
                .filter(c => c.slug && c.active !== false)
                .map(c => ({
                  slug: c.slug,
                  envSlug: c.slug.toUpperCase().replace(/-/g, '_')
                }));
            } catch (e) {
              // a corrupted registry must turn the report RED, not silently skip it
              console.log('::error::registry unreadable (no channel selected): ' + (e.message || e));
              process.exit(1);
            }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  report:
    name: 📈 Fetch channel data — ${{ matrix.slug.slug }}
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 4
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLUG: ${{ matrix.slug.slug }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔑 Resolve this channel's token
        env:
          DYN_TOKEN: ${{ secrets[format('YT_TOKEN_{0}', matrix.slug.envSlug)] }}
        run: |
          ENV_NAME="YT_TOKEN_$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          if [ -z "$DYN_TOKEN" ]; then
            # reporting GAP semantics (unchanged): a missing token empties this
            # channel's YouTube rows — it must not kill the channel's FB half
            echo "::warning::secret ${ENV_NAME} is missing — YouTube rows for this channel will GAP"
            exit 0
          fi
          # J1 (2026-11-20): some token secrets are multi-line JSON (YT_TOKEN_YT_BOT)
          # — the single-line NAME=value form failed with "Invalid format" since
          # 11-17. The heredoc-delimiter form is safe for one line or many.
          DELIM="TOKEN_EOF_$(openssl rand -hex 8)"
          {
            echo "${ENV_NAME}<<${DELIM}"
            echo "${DYN_TOKEN}"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: 📈 Fetch this channel's data (fragment for the collect job)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }} #120: vault v2 — CI loader needs the master key
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node daily-excel-report.mjs --channel "$SLUG"

      - name: ⬆️ Upload channel fragment
        uses: actions/upload-artifact@v4
        with:
          name: report-fragment-${{ matrix.slug.slug }}
          path: reports/fragments
          retention-days: 7
          if-no-files-found: error

  collect:
    name: 📊 Build & send the daily payload
    needs: [discover, report]
    if: ${{ !cancelled() && needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout (push-capable)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.SECRET_WRITER_PAT }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⬇️ Download every channel fragment (missing ones GAP in the workbook)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: report-fragment-*
          merge-multiple: true
          path: reports/fragments

      - name: Build & Send Reports
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node daily-excel-report.mjs daily --collect
          # PKT weekday: 0=Sunday → also weekly; 1st of month → also monthly
          PKTDOW=$(date -u -d "+5 hours" +%w)
          PKTDATE=$(date -u -d "+5 hours" +%d)
          if [ "$PKTDOW" = "0" ]; then node daily-excel-report.mjs weekly --collect; fi
          if [ "$PKTDATE" = "01" ]; then node daily-excel-report.mjs monthly --collect; fi

      - name: 🧹 Weekly FB duplicate-reel cleanup (Mondays only)
        if: ${{ github.event.schedule != '' }}
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then node fb-dedupe.mjs --apply; else echo "not Monday — skip"; fi

      - name: 💾 Commit stats history back to repo
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add state/ logs/ || true
          git diff --cached --quiet || git commit -m "report state: $(date -u -d '+5 hours' +%F)"
          git push || true

      - name: 🖼️ Upload PDF + Excel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/*.pdf
            reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
