name: 🚀 Autonomous Multi-Brand Content Engine

on:
  schedule:
    # High-CPM audience windows (US/UK/CA/AU/UAE): 08:30 UTC = UK morning +
    # AU evening + UAE noon; 16:30 UTC = US lunch + UK afternoon + UAE evening;
    # 23:00 UTC = US evening prime + AU morning. Mon-Sat (Sunday skipped:
    # worst engagement day per 2025-26 studies).
    - cron: '30 8 * * 1-6'
    - cron: '30 16 * * 1-6'
    - cron: '0 23 * * 1-6'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to Publish'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '0 - Silent Wealth'
          - '1 - Strategic Silence'
          - '2 - Eon Ventures'
          - '3 - Reliq North'
          - '4 - The Boundaries Club'
      achievement:
        description: 'Publish as 🏆 Earned Achievement Milestone?'
        required: false
        type: boolean
        default: false
      mode:
        description: 'Content Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'text_posts_only'

concurrency:
  group: content-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: 🎬 Generate & Publish Content
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            echo "ffmpeg not on runner — installing via apt..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          echo "FFmpeg ready."

      - name: 🔤 Install Fonts (SVG vector typography rendering)
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv
          fc-list | grep -i -c "Playfair\|Anton\|Oswald\|Inter\|Cinzel\|Archivo\|Cormorant\|Space Mono" || true
          echo "Fonts ready."

      - name: 🗣️ Install TTS engines (Kokoro → Edge fallback chain)
        run: |
          python3 -m pip install --quiet --user edge-tts kokoro-onnx || pip install --quiet edge-tts kokoro-onnx || true
          python3 -c "import edge_tts, kokoro_onnx; print('TTS engines ready.')" || echo "TTS partial — fallbacks handle it."
          # Kokoro-82M ONNX model (~350MB) into the CACHED pixabay-pool dir
          curl -sL --retry 3 -o pixabay-pool/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" || true
          curl -sL --retry 3 -o pixabay-pool/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" || true
          ls -la pixabay-pool/kokoro-v1.0.onnx pixabay-pool/voices-v1.0.bin 2>/dev/null || echo "Kokoro model missing — Edge fallback."

      - name: 🎨 Start Image & Video Engine (Background Service)
        run: |
          node image-tools/server.js &
          sleep 3
          curl -s http://localhost:3210/ || echo "Server starting..."

      - name: 🚀 Run Autonomous Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          ZERNIO_TIKTOK_DRAFT: ${{ secrets.ZERNIO_TIKTOK_DRAFT }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SECRET_WRITER_PAT: ${{ secrets.SECRET_WRITER_PAT }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_PIN_LINK: ${{ secrets.PINTEREST_PIN_LINK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          ACHIEVEMENT_FLAG=""
          if [ "${{ github.event.inputs.achievement }}" = "true" ]; then
            ACHIEVEMENT_FLAG="--achievement"
          fi

          if [ "${{ github.event.inputs.mode }}" = "text_posts_only" ]; then
            echo "Publishing Text Posts to All Pages..."
            node post-text-engine.mjs
          elif [ "${{ github.event.inputs.brand }}" = "all" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ -z "${{ github.event.inputs.brand }}" ]; then
            echo "Publishing Full Multi-Format Content across ALL 5 Brands..."
            for i in 0 1 2 3 4; do
              echo ">>> Running Brand index $i $ACHIEVEMENT_FLAG..."
              node run-content-machine.mjs $i $ACHIEVEMENT_FLAG || true
            done
          else
            SELECTED_INDEX=$(echo "${{ github.event.inputs.brand }}" | cut -d' ' -f1)
            echo "Publishing Brand index: $SELECTED_INDEX $ACHIEVEMENT_FLAG..."
            node run-content-machine.mjs $SELECTED_INDEX $ACHIEVEMENT_FLAG
          fi

      - name: 💾 Commit post logs back to repo
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add logs/posts-log.json || true
          git diff --cached --quiet || git commit -m "post log: $(date -u -d '+5 hours' +%F-%H%M)"
          git push || true

      - name: 🖼️ Upload Generated Media Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-media-${{ github.run_id }}
          path: |
            post-*.jpg
            post-*.png
            reel-*.mp4
            yt-short-*.mp4
          if-no-files-found: ignore
          retention-days: 7

  multi-channel:
    name: 🎛️ Multi-Channel Production — IC/MR/DFD (3 Shorts + 1 Episode + FB/IG)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔊 Install & Verify FFmpeg
        run: |
          if ! command -v ffmpeg > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: 🔤 Install Fonts
        run: |
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
          mkdir -p ~/.local/share/fonts ~/.fonts
          cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -fv

      - name: 🗣️ Install TTS engines (edge-tts + Kokoro-82M)
        run: |
          python3 -m pip install --quiet edge-tts kokoro-onnx soundfile || true
          python3 -c "import edge_tts; print('edge-tts ready.')"
          python3 -c "import kokoro_onnx; print('kokoro ready.')" || echo "kokoro unavailable — edge fallback."

      - name: 🎨 Start Image & Video Engine
        run: |
          node image-tools/server.js &
          sleep 3

      - name: 🚀 Produce — Shorts + Episodes + FB/IG outbox
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          YT_TOKEN_MONEY_RULEBOOK: ${{ secrets.YT_TOKEN_MONEY_RULEBOOK }}
          YT_TOKEN_DEBT_FREE_DOCTRINE: ${{ secrets.YT_TOKEN_DEBT_FREE_DOCTRINE }}
        run: |
          node yt-daily.mjs investors-compass
          node yt-daily.mjs money-rulebook
          node yt-daily.mjs debt-free-doctrine
          node fb-crosspost.mjs
          node ig-crosspost.mjs
          node fb-images.mjs

      - name: 💾 Commit publishing state back
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/schedule-state.json yt-mcp/trends-*.json || true
          git diff --cached --quiet || git commit -m "multi-channel daily state [skip ci]"
          git push
