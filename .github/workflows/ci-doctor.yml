name: 🏥 CI Doctor — Self-Healing Monitor

on:
  schedule:
    # Runs 30 min after each production window to verify results
    - cron: '5 12 * * *'    # after 08:30 UTC production
    - cron: '5 20 * * *'    # after 16:30 UTC production
    - cron: '5 3 * * *'     # after 23:00 UTC production
  workflow_dispatch:

concurrency:
  group: ci-doctor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  doctor:
    name: 🏥 Check Production Results & Auto-Draft Issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏥 Run Health Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          YT_TOKEN_MONEY_RULEBOOK: ${{ secrets.YT_TOKEN_MONEY_RULEBOOK }}
          YT_TOKEN_DEBT_FREE_DOCTRINE: ${{ secrets.YT_TOKEN_DEBT_FREE_DOCTRINE }}
          YT_TOKEN_QUOTEQUARRY: ${{ secrets.YT_TOKEN_QUOTEQUARRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > ci-doctor.mjs << 'DOCTOR'
          // CI Doctor: checks what actually published in the last 24h
          // Creates GitHub issues for any gaps, auto-labels for triage
          import fs from 'node:fs';
          import { google } from 'googleapis';

          const ENV_PATH = '.env';
          const envRaw = fs.existsSync(ENV_PATH) ? fs.readFileSync(ENV_PATH, 'utf8') : '';
          for (const m of envRaw.matchAll(/^([A-Z_0-9]+)=(.*)$/gm)) process.env[m[1]] ??= m[2].trim();

          const SLUGS = ['investors-compass', 'money-rulebook', 'debt-free-doctrine', 'quotequarry'];
          const report = { checks: [], issues: [] };

          function channelAuth(slug) {
            const envName = `YT_TOKEN_${slug.toUpperCase().replace(/-/g, '_')}`;
            const tokenFile = `yt-mcp/channels/${slug}/token.json`;
            const raw = process.env[envName] || (fs.existsSync(tokenFile) ? fs.readFileSync(tokenFile, 'utf8') : '');
            if (!raw) return null;
            const t = JSON.parse(raw);
            const auth = new google.auth.OAuth2(process.env.YOUTUBE_CLIENT_ID, process.env.YOUTUBE_CLIENT_SECRET);
            auth.setCredentials({ refresh_token: t.refresh_token });
            return auth;
          }

          for (const slug of SLUGS) {
            const auth = channelAuth(slug);
            if (!auth) { report.checks.push({ slug, status: 'NO_TOKEN' }); continue; }
            const yt = google.youtube({ version: 'v3', auth });
            const { data } = await yt.search.list({ part: 'snippet', forMine: true, type: 'video', order: 'date', maxResults: 10, publishedAfter: new Date(Date.now() - 86400000).toISOString() });
            const recent = data.items?.length || 0;
            report.checks.push({ slug, status: recent > 0 ? 'OK' : 'NO_RECENT_POSTS', recentVideos: recent });
            if (recent === 0) {
              report.issues.push(`⚠️ ${slug}: no videos published in last 24h — check provider health and state`);
            }
          }

          // Write report
          fs.writeFileSync('ci-doctor-report.json', JSON.stringify(report, null, 2));
          console.log('Report:', JSON.stringify(report, null, 2));

          // Create GitHub issue if there are problems
          if (report.issues.length > 0) {
            const body = `## CI Doctor Report\n\n${report.issues.join('\n')}\n\n_Auto-generated by CI Doctor at ${new Date().toISOString()}_`;
            try {
              await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues`, {
                method: 'POST',
                headers: { Authorization: `token ${process.env.GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: `🏥 CI Doctor: ${report.issues.length} issue(s) found`, body, labels: ['auto-detected', 'ci-doctor'] })
              });
            } catch (e) { console.log('Issue creation skipped:', e.message); }
          }

          DOCTOR
          node ci-doctor.mjs

      - name: 💾 Commit doctor report
        run: |
          git config user.name "ci-doctor"
          git config user.email "doctor@quarrystudio"
          git add ci-doctor-report.json || true
          git diff --cached --quiet || git commit -m "ci-doctor report [skip ci]"
          git push || true
