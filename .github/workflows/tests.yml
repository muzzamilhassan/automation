name: 🧪 Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci: exact lockfile install (fails loudly if package.json and the
      # lock drift). Root deps only — tests/root-manifest-imports.test.mjs
      # guards that every package the suite reaches is declared at the root.
      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test

      # audit 2026-11-13 #3: main sat red for 6+ pushes unnoticed — page once.
      - name: 🔔 Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node --input-type=module -e "
            import { sendAlert } from './lib/ntfy-alert.mjs';
            const subject = (process.env.COMMIT_MSG || '').split('\n')[0].slice(0, 80);
            await sendAlert({ title: 'CI tests failed on main', text: subject + '\n' + process.env.RUN_URL });
          "

  brain:
    name: 🧠 Brain python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/ai/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install Dependencies
        run: pip install -r services/ai/requirements.txt

      - name: 🧠 Run Brain Tests
        run: pytest services/ai/tests
