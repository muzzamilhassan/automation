name: 🧪 Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Tests
        run: npm test

  brain:
    name: 🧠 Brain python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/ai/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📦 Install Dependencies
        run: pip install -r services/ai/requirements.txt

      - name: 🧠 Run Brain Tests
        run: pytest services/ai/tests
