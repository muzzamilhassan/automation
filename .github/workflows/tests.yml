name: 🧪 Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Tests
        run: npm test
