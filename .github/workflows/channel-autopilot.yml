# 10-05 CHANNEL FACTORY — ONE workflow for every channel.
# The registry (yt-mcp/studio-channels.json) is the source of truth: scheduled
# cron offsets match each channel's cron window, and workflow_dispatch allows
# single-channel runs or batch runs.
#
# Tokens: each channel stores its token in secret YT_TOKEN_<SLUG> where
# <SLUG> = slug uppercased with dashes -> underscores (quote-quarry -> QUOTE_QUARRY).
# Docs are produced by yt-deepdive on each channel's docDay INSIDE the pipeline
# run (cadence: 1 short/day, weekly doc, Sunday break — enforced in the engine).

name: 🏭 Channel Autopilot — all channels
# Display title only (no behavior change): lets the panel's Runs page tell
# which channel a run belonged to.
run-name: "${{ inputs.channel || ((inputs.heartbeat == '1' || github.event_name == 'schedule') && 'heartbeat') || 'all channels' }} · ${{ github.event_name }}"

on:
  schedule:
    # T4a: ONE 30-minute scheduler heartbeat (:05/:35 — off the top-of-hour
    # minute GitHub's delay spike piles onto). Per-channel times live in the
    # registry (yt-mcp/studio-channels.json, entry.cron mirrored in
    # kit.gateCron — editable from the Admin Panel's scheduling card): the
    # discover step below slot-gates every heartbeat, so a channel runs only
    # when the current UTC time is inside the 30 minutes after its scheduled
    # time (windows wrap past midnight). Entries without a valid daily cron
    # keep the legacy wizard catch-all slot (02:33 UTC). Editing a channel's
    # time is a registry edit — no workflow change, and all channels no
    # longer pile onto one minute.
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "one slug (blank = all channels)"
        required: false
        default: ""
      topup:
        description: "heal N slots (blank = normal daily run)"
        required: false
        default: ""
      force_doc:
        description: "1 = force today's documentary even off docDay (testing/manual)"
        required: false
        default: ""
      resume:
        description: "job_id to resume (review-queue approval — the held job's id; blank = fresh run)"
        required: false
        default: ""
      # External clock (cron-job.org, audit #10): GitHub's own cron drops most
      # ticks. heartbeat=1 makes a dispatch slot-gated EXACTLY like the
      # schedule event — never send a blank dispatch from a clock (blank =
      # every channel, every tick).
      heartbeat:
        description: "1 = external scheduler tick (slot-gated like the cron); blank = manual run"
        required: false
        default: ""
      # "Ask the factory" (2026-11-23): the owner's topic for ONE video. Used
      # only on a manual single-channel fresh dispatch (see FACTORY_TOPIC on
      # the pipeline step); travels as env, never into a shell line; the
      # engine sanitises it (studio/lib/factory-plan.mjs). Blank = the lanes
      # pick their own topic exactly as before.
      topic:
        description: "owner topic for one video (≤160 chars; single channel only; blank = researched topic)"
        required: false
        default: ""
      lane:
        description: "short | doc for the topic (doc = only the documentary, Shorts phase skipped; needs topic; blank = short)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write # verify-run second alert channel (#91)
  actions: read # clips self-feed run-scan (post-next #101 empty-queue rebuild)

jobs:
  discover:
    # 1-vCPU runner ($0.002/min vs $0.006): discover only reads JSON, and with an
    # external 30-min clock it runs 48x/day — each job bills at least 1 minute.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry
        id: disc
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_HEARTBEAT: ${{ inputs.heartbeat }}
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { pathToFileURL } from 'node:url';
            let toDiscoverChannels = null;
            let selectChannelsForSlot = null;
            let selectChannelsDueOrMissed = null;
            try {
              // T4a: the discovery mapping + slot-gating pure functions live in
              // lib/ (tested there); this eval script imports them by file path
              // from the repo root.
              ({ toDiscoverChannels, selectChannelsForSlot, selectChannelsDueOrMissed } = await import(pathToFileURL(process.cwd() + '/lib/schedule-slot.mjs')));
            } catch (e) {
              console.log('::error::slot-gate module unreadable: ' + (e.message || e));
            }
            let chans = [];
            // Owner 2026-11-21: only channels 7/7 ready in the panel run. The
            // upload days live in the cadence file; unreadable = nothing is
            // ready (fail closed). Each dropped channel is logged with what is missing.
            let cadence = null;
            try {
              cadence = JSON.parse(fs.readFileSync('yt-mcp/cadence.json', 'utf8'));
            } catch (e) { console.log('::warning::cadence file unreadable — no channel counts as ready: ' + (e.message || e)); }
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              const all = toDiscoverChannels(reg.channels, { cadence, log: (m) => console.log(m) });
              const target = (process.env.INPUT_CHANNEL || '').trim();
              const sched = (process.env.EVENT_SCHEDULE || '').trim();
              const heartbeat = (process.env.INPUT_HEARTBEAT || '').trim() === '1';
              // DISCOVER_NOW: test-only clock override (unset in production)
              const now = process.env.DISCOVER_NOW ? new Date(process.env.DISCOVER_NOW) : new Date();
              if (target) {
                chans = all.filter(c => c.slug === target);
              } else if (sched || heartbeat) {
                // heartbeat fired: gate each channel on its own registry cron (with catch-up for missed slots)
                const statesBySlug = {};
                for (const c of all) {
                  try { statesBySlug[c.slug] = JSON.parse(fs.readFileSync('yt-mcp/state/' + c.slug + '.json', 'utf8')); } catch {}
                }
                chans = selectChannelsDueOrMissed
                  ? selectChannelsDueOrMissed(all, statesBySlug, now)
                  : (selectChannelsForSlot ? selectChannelsForSlot(all, now) : []);
              } else {
                chans = all;
              }
            } catch (e) { console.log('::error::registry unreadable (no channel selected): ' + (e.message || e)); }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  # 2026-11-25 (docs/qa/facts-first-qa.md): scripts the owner did not answer in time
  # (kit.autoApproveHours, default 2) are approved here — only when every number has
  # a source. Scheduler ticks only; a manual run never approves anything.
  auto-approve:
    if: ${{ github.event_name == 'schedule' || inputs.heartbeat == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write # starts the approved video's run (same dispatch as the Approve button)
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund
      - name: ✅ Approve unanswered scripts with checked facts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/auto-approve.mjs

  produce:
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 3
      fail-fast: false
    concurrency:
      group: channel-${{ matrix.slug.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 120 (was 90): the documentary lane alone may now take up to 75 min
    # (channel-pipeline DOC_TIMEOUT_MS) after setup + the Shorts lane.
    timeout-minutes: 120
    env:
      SLUG: ${{ matrix.slug.slug }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Restore Pixabay 4K clip pool
        uses: actions/cache@v4
        with:
          path: pixabay-pool
          key: pixabay-pool-v1

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Node Dependencies
        run: npm install

      # Step C1a shadow week (Neon single source of truth): rebuild the engine
      # feed + cadence from Neon and compare with the committed files; the
      # result is stored in registry_shadow_checks. Read-only for the run —
      # never changes the files, never fails the job.
      - name: 🪞 Registry shadow check (Neon vs committed files)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/export-registry.mjs --check --record

      - name: 🔊 Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: 🎨 Setup Render Environment
        uses: ./.github/actions/setup-render

      - name: 🔑 Resolve this channel's token
        env:
          DYN_TOKEN: ${{ secrets[format('YT_TOKEN_{0}', matrix.slug.envSlug)] }}
        run: |
          ENV_NAME="YT_TOKEN_$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          if [ -z "$DYN_TOKEN" ]; then
            echo "::error::secret ${ENV_NAME} is missing — connect the channel in Studio first"
            exit 1
          fi
          # J1 (2026-11-20): multi-line token secrets (YT_TOKEN_YT_BOT) need the
          # heredoc-delimiter form; NAME=value fails with "Invalid format".
          DELIM="TOKEN_EOF_$(openssl rand -hex 8)"
          {
            echo "${ENV_NAME}<<${DELIM}"
            echo "${DYN_TOKEN}"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: 🧠 Start brain sidecar (issue #105)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -q -r services/ai/requirements.txt
          (cd services/ai && nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > brain-sidecar.log 2>&1 &)
          # readiness wait: model load + pg probe within the 30s budget (spec D1/D7)
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "brain sidecar ready (attempt $i)"; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || echo "::warning::brain sidecar not ready — generators fail open (legacy path)"

      - name: 🚀 Channel Pipeline — Shorts (+ weekly episode on docDay)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }} #120: vault v2 — CI loader needs the master key
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Template registry preflight (issue #102): unassigned channels keep the legacy
          # path (preflight degrades to legacy+ntfy warning if the DB is unreachable).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Thumbnail candidates (step-5 fix): the PRIVATE blob store needs the
          # token or putBytes degrades (blob_url null — the Review desk can't
          # display candidates). Inert until the secret exists; add
          # BLOB_READ_WRITE_TOKEN from Vercel (Storage → the blob store → token).
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Brain (issue #105): context injection + variation gate + usage ledger.
          # BRAIN_ENABLED unset = zero-config legacy path (byte-identical prompts).
          BRAIN_ENABLED: '1'
          BRAIN_EMBED_ENABLED: '1'
          BRAIN_PORT: '8000'
          # Phase 4 (#106): job save-points + resume, review-queue gate.
          JOB_STORE_ENABLED: '1'
          REVIEW_QUEUE_ENABLED: '1'
          # "Ask the factory": the owner's topic + lane — ONLY a manual
          # dispatch for ONE channel with a topic that is not a heartbeat,
          # resume or topup (anything else = blank = byte-identical legacy
          # run). Env only: never put inputs.topic in a run: line (shell
          # injection). The factory NEVER adds --force: lane=doc makes only
          # the documentary (channel-pipeline skips the Shorts phase).
          FACTORY_TOPIC: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel != '' && inputs.heartbeat != '1' && inputs.resume == '' && inputs.topup == '' && inputs.topic != '') && inputs.topic || '' }}
          FACTORY_LANE: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel != '' && inputs.heartbeat != '1' && inputs.resume == '' && inputs.topup == '' && inputs.topic != '') && inputs.lane || '' }}
        # --resume is SPACE-form on purpose: channel-pipeline.mjs parses
        # `--resume <job_id>` (argv.includes('--resume') + next arg) — a
        # `--resume=<id>` token would be silently ignored (no resume trigger).
        # This is the review-queue approval path (#106 T5): approve at
        # Studio > Review dispatches resume=<held job id> and the run
        # re-enters at the first non-succeeded step (D4).
        run: node channel-pipeline.mjs "$SLUG" ${{ inputs.topup && format('--topup={0}', inputs.topup) || '' }} ${{ inputs.force_doc == '1' && '--force' || '' }} ${{ inputs.resume && format('--resume {0}', inputs.resume) || '' }}  # --no-episode brake lifted 2026-11-03: the #106 visual-layer fix landed (transparent lower-third, loud fail-closed b-roll gate, width fallback) and the harness is green (doc-visual-layer.test.mjs 16/16).

      - name: 📦 Keep reels for IG slot poster
        if: ${{ hashFiles(format('fb-outbox/{0}/*.json*', matrix.slug.slug)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: fb-outbox/${{ matrix.slug.slug }}
          key: ig-outbox-${{ matrix.slug.slug }}-${{ github.run_id }}

      - name: ⬆️ Upload doc render artifact (docDay only)
        if: ${{ hashFiles(format('tt-lf/lf-{0}.mp4', matrix.slug.slug)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lf-${{ matrix.slug.slug }}
          path: tt-lf/lf-${{ matrix.slug.slug }}.mp4
          retention-days: 30

      - name: ⬆️ Upload doc meta artifact
        if: ${{ hashFiles(format('tt-lf/lf-meta-{0}.json', matrix.slug.slug)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lf-meta-${{ matrix.slug.slug }}
          path: tt-lf/lf-meta-${{ matrix.slug.slug }}.json
          retention-days: 30

      - name: ⬆️ Upload doc SRT artifact (#96 — clips lane supply)
        if: ${{ hashFiles(format('tt-lf/lf-srt-{0}.srt', matrix.slug.slug)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lf-srt-${{ matrix.slug.slug }}
          path: tt-lf/lf-srt-${{ matrix.slug.slug }}.srt
          retention-days: 30

      - name: 💾 Commit publishing state
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/state/ yt-mcp/schedule-state.json yt-mcp/studio-channels.json || true
          git diff --cached --quiet || git commit -m "autopilot ${SLUG} daily state [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || echo "::warning::state push failed for ${SLUG} — state stays local to this run"

      # Live fix wave A4 (T2-01): a failed run raises ONE real alert
      # (run_failed, action_required, with the run link) — before this, a job
      # failing outside the doc lane was silent. Never fails the job further.
      - name: 🚨 Raise an alert for this failed run
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/emit-run-failed.mjs
