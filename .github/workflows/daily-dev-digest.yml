name: 📰 Daily.dev news digest + topic brain

on:
  schedule:
    # 00:45 UTC = 05:45 PKT — morning digest (GitHub crons can run a few hours late)
    - cron: '45 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-dev-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout (push-capable — topic bank gets committed)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.SECRET_WRITER_PAT }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📰 Fetch daily.dev news + push digest to phone
        env:
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node daily-dev-digest.mjs

      - name: 🧠 Score trends + update tech topic bank
        env:
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tech-topic-brain.mjs

      - name: 💾 Commit topic bank
        run: |
          git config user.name "topic-brain"
          git config user.email "brain@quarrystudio"
          git add state/tech-topic-bank.json || true
          git diff --cached --quiet || git commit -m "tech topic bank update [skip ci]"
          git pull --rebase || true
          git push || true
