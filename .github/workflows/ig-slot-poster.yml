name: 📸 IG Reels — Slot Poster

# IG has no scheduling API, so reels are posted HERE at fixed audience slots
# instead of the instant a channel pipeline finishes. Each run posts ONE queued
# reel per channel (oldest first, tracked in yt-mcp/ig-state.json).
# Reels are produced by the channel workflows overnight and handed over via
# the actions cache (ig-outbox-<slug>-*).
#
# #106 T4b: ONE matrix job per ACTIVE registry channel (discover step reads
# yt-mcp/studio-channels.json — the channel-autopilot.yml pattern). A job
# whose fb-outbox/<slug> cache misses is a harmless no-op; the Threads
# hand-off runs in every job but only the job that actually restored the
# outbox dir it reads can find a reel, and its date-guard keeps it to one
# post per day.

on:
  # 2026-10-23 owner: platforms paused (YouTube-only focus) — schedules off.
  # To resume: uncomment the three crons below.
  # schedule:
  #   - cron: '20 11 * * *'   # 07:20 New York — US morning scroll
  #   - cron: '20 15 * * *'   # 11:20 New York — US lunch
  #   - cron: '20 22 * * *'   # 18:20 New York — US evening prime
  workflow_dispatch:

# State commits below need write access (default-token restrictions would silently break them — see issue #70)
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry
        id: disc
        run: |
          node -e "
            const fs = require('fs');
            let chans = [];
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              chans = (reg.channels || [])
                .filter(c => c.active !== false)
                .map(c => ({
                  slug: c.slug,
                  envSlug: c.slug.toUpperCase().replace(/-/g, '_')
                }));
            } catch (e) { console.log('registry unreadable:', e.message); }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  post:
    name: Post one queued reel — ${{ matrix.slug.slug }}
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 3
      fail-fast: false
    concurrency:
      #63: same-slug drains serialize across BOTH drain workflows (fb-now and
      # this one share the group name — no workflow dimension). Parallel
      # same-slug runs overwrote each other's outbox cache, resurrecting
      # posted reels. Drains restore-only and never re-save.
      group: crosspost-${{ matrix.slug.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: ${{ matrix.slug.slug }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: ♻️ Restore queued reels for ${{ matrix.slug.slug }}
        uses: actions/cache@v4
        with:
          path: fb-outbox/${{ matrix.slug.slug }}
          key: ig-outbox-${{ matrix.slug.slug }}-${{ github.run_id }}
          restore-keys: ig-outbox-${{ matrix.slug.slug }}-

      - name: 📸 Post one queued reel
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          mkdir -p fb-outbox
          node ig-crosspost.mjs --one

      - name: 🧵 Threads — one reel per day (restored 09-20; died with content-machine on 09-15)
        env:
          THREADS_TOKEN_JSON: ${{ secrets.THREADS_TOKEN_JSON }}
        run: node threads-daily.mjs

      - name: 💾 Commit IG slot state
        run: |
          git config user.name "quarry-bot"
          git config user.email "bot@quotequarry.local"
          git add yt-mcp/ig-state.json yt-mcp/state/ || true
          git diff --cached --quiet || git commit -m "ig slot state [skip ci]"
          git push || true
