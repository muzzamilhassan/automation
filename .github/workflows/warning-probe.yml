# Phase 4 T4 — parked-channel liveness (spec D11, AC-P4-14; review finding 1:
# parking must never deadlock). One matrix lane per registry channel — the
# registry (yt-mcp/studio-channels.json) is the source of truth, NO static
# channel map (channels scale with zero code changes; a channel 5 with a saved
# token heals like the others). Tokens: secret YT_TOKEN_<SLUG>, <SLUG> =
# slug uppercased with dashes -> underscores — resolved DYNAMICALLY per lane
# via secrets[format('YT_TOKEN_{0}', envSlug)] (mirror of channel-autopilot).
name: 🚑 Warning probes (parked channels)

on:
  schedule:
    # 05:41 UTC = off-peak slot: after the nightly production window
    # (02:13-03:53 UTC) and ~11h before the 16:45 reporting lane. Re-tests
    # every parked channel so a fixed token un-parks its channel by morning
    # without anyone touching anything.
    - cron: '41 5 * * *'
  workflow_dispatch:

# Least privilege: read the repo; open/comment issues as the durable second
# alert channel when the store itself is unreachable (AC-P4-5).
permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.disc.outputs.channels }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🔎 Read the channel registry (active + token channels)
        id: disc
        run: |
          node -e "
            const fs = require('fs');
            let chans = [];
            try {
              const reg = JSON.parse(fs.readFileSync('yt-mcp/studio-channels.json', 'utf8'));
              chans = (reg.channels || [])
                .filter(c => c.active !== false && c.tokenSecretSaved !== false)
                .map(c => ({ slug: c.slug, envSlug: c.slug.toUpperCase().replace(/-/g, '_') }));
            } catch (e) { console.log('registry unreadable:', e.message); }
            console.log(JSON.stringify(chans));
            fs.writeFileSync(process.env.GITHUB_OUTPUT, 'channels=' + JSON.stringify(chans));
          "

  probe:
    needs: discover
    if: ${{ needs.discover.outputs.channels != '[]' && needs.discover.outputs.channels != '' }}
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.channels) }}
      max-parallel: 5
      fail-fast: false
    concurrency:
      group: warning-probe-${{ matrix.slug.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔑 Resolve this channel's token (dynamic secret name — registry-driven)
        env:
          SLUG: ${{ matrix.slug.slug }}
          DYN_TOKEN: ${{ secrets[format('YT_TOKEN_{0}', matrix.slug.envSlug)] }}
        run: |
          ENV_NAME="YT_TOKEN_$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          if [ -z "$DYN_TOKEN" ]; then
            # A parked channel without a saved secret can't be probed tonight —
            # surface it, but don't fail the night for the other lanes (the
            # warning row keeps the channel parked; the runner records it).
            echo "::warning::secret ${ENV_NAME} is missing — ${SLUG} cannot be probed"
            exit 0
          fi
          echo "${ENV_NAME}=${DYN_TOKEN}" >> "$GITHUB_ENV"

      - name: 🚑 Probe parked channel (refresh + 1-unit channels.list; auto-resolve on pass)
        env:
          SLUG: ${{ matrix.slug.slug }}
          # Warnings table (enumerates parked rows, stamps last_checked,
          # auto-resolves passes) — same Neon the autopilot/brain jobs use.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # OAuth client for the refresh; NTFY/GH only for the store-unreachable
          # fallback alert (probe activity itself never re-alerts, D11).
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }} #120: vault v2 — CI loader needs the master key
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/warnings-probe.mjs "$SLUG"

  # #106 T5 round 1 (MAJOR 4 — M4/D17/AC-P4-19's nightly half): approval-timeout
  # sweep, folded into this off-peak workflow (05:41 UTC) as a NETWORK-WIDE job
  # — the probe job above is a per-channel matrix, but the sweep has no channel
  # context (no tokens, no YouTube quota), so it runs ONCE after the matrix.
  # Every awaiting_review script past its slot publishAt (else end-of-day) gets
  # ONE Action-required review_timeout warning and is RETAINED awaiting_review
  # (retain-and-resume: a later approval resumes at render without re-spend).
  # The run-start half lives in the review gate (channel-pipeline.mjs).
  review-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 📦 Install Dependencies
        run: npm install
      - name: ⏰ Sweep approval timeouts (retain-and-resume)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/review-sweep.mjs
