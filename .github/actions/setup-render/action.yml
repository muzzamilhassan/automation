name: 'Setup Render'
description: 'Install system fonts, Edge-TTS, Kokoro-82M, and start image-tools server'

runs:
  using: 'composite'
  steps:
    - name: 🔤 Install Fonts
      shell: bash
      run: |
        sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fontconfig >/dev/null 2>&1 || true
        mkdir -p ~/.local/share/fonts ~/.fonts
        cp image-tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
        cp image-tools/fonts/* ~/.fonts/ 2>/dev/null || true
        fc-cache -fv

    - name: 🗣️ Install TTS engines (edge-tts + Kokoro-82M)
      shell: bash
      run: |
        python3 -m pip install --quiet edge-tts kokoro-onnx soundfile || true
        python3 -c "import edge_tts; print('edge-tts ready.')"
        python3 -c "import kokoro_onnx; print('kokoro ready.')" || echo "kokoro unavailable — edge fallback."

    # Step 1 human voice lane (docs/qa/step1-mr-voice-moneyflow-qa.md): ONLY for a
    # channel whose lib/brands.json kit carries voiceProfile — every other channel
    # skips this step entirely (default-inert). Installs the aligner and makes sure the
    # fp32 Kokoro model is on disk (the shared pixabay-pool cache may predate it).
    # Never fails the job: narrate.py falls back to the legacy chain if anything is missing.
    - name: 🗣️ Human voice lane (channels with a voiceProfile)
      shell: bash
      run: |
        if node -e "const b=require('./lib/brands.json');const k=(b.brands||b)[process.env.SLUG||''];process.exit(k&&k.voiceProfile?0:1)" 2>/dev/null; then
          python3 -m pip install --quiet faster-whisper || echo "faster-whisper unavailable — legacy voice fallback"
          mkdir -p pixabay-pool
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "pixabay-pool/$f" ] || curl -sL --retry 3 -o "pixabay-pool/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f" || true
          done
          ls -la pixabay-pool/kokoro-v1.0.onnx pixabay-pool/voices-v1.0.bin || true
        else
          echo "no voiceProfile for '${SLUG:-}' — legacy voice paths"
        fi

    - name: 🎨 Start Image & Video Engine
      shell: bash
      run: |
        node image-tools/server.js &
        sleep 3
