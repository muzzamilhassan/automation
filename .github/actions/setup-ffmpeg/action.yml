name: 'Setup FFmpeg'
description: 'Install FFmpeg and Remotion system libraries'

runs:
  using: 'composite'
  steps:
    - name: 🔊 Install & Verify FFmpeg
      shell: bash
      run: |
        if ! command -v ffmpeg > /dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi
        ffmpeg -version | head -n 1

    - name: 🎬 Install Remotion system libraries (Ubuntu 24.04)
      shell: bash
      run: |
        sudo apt-get install -y -qq \
          libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
          libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
          libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0 >/dev/null 2>&1 || true
