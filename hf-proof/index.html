<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #0d0c0a;
      }
      #root {
        position: relative; width: 1080px; height: 1920px;
        background:
          radial-gradient(1200px 800px at 30% 20%, rgba(214,188,128,0.10), transparent 60%),
          radial-gradient(1000px 900px at 75% 85%, rgba(214,188,128,0.06), transparent 55%),
          linear-gradient(180deg, #100e0b 0%, #0d0c0a 45%, #0a0908 100%);
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      #glow {
        position: absolute; left: -200px; top: 500px; width: 1400px; height: 1400px;
        background: radial-gradient(closest-side, rgba(214,188,128,0.08), transparent 70%);
      }
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
      }
      .grain { position: absolute; inset: 0; opacity: 0.05; }
      .frame {
        position: absolute; inset: 70px; border: 1px solid rgba(242,234,217,0.14);
      }
      .kicker {
        position: absolute; left: 130px; top: 190px;
        font-family: 'Inter', sans-serif; font-weight: 500; font-size: 26px;
        letter-spacing: 0.42em; color: #e6e0d2; text-transform: uppercase;
      }
      .kicker-rule {
        position: absolute; left: 130px; top: 248px; height: 1px; width: 180px;
        background: linear-gradient(90deg, #d9c189, rgba(201,169,98,0));
      }
      .beat {
        position: absolute; left: 130px; right: 130px; top: 700px;
        font-weight: 500; color: #f2ead9;
        font-size: 108px; line-height: 1.18; letter-spacing: -0.01em;
        text-shadow: 0 2px 24px rgba(0,0,0,0.6);
      }
      .beat .em { color: #d9c189; font-style: italic; }
      .beat .w { display: inline-block; will-change: transform, opacity; }
      .endcard { position: absolute; inset: 0; text-align: center; }
      .endcard .brand {
        position: absolute; left: 0; right: 0; top: 850px;
        font-size: 96px; font-weight: 600; letter-spacing: 0.08em;
        color: #f2ead9; text-transform: uppercase;
        text-shadow: 0 2px 24px rgba(0,0,0,0.6);
      }
      .endcard .rule { position: absolute; left: 410px; top: 1000px; width: 260px; height: 1px; background: #d9c189; }
      .endcard .sub {
        position: absolute; left: 0; right: 0; top: 1050px;
        font-family: 'Inter', sans-serif; font-size: 24px; letter-spacing: 0.3em;
        color: rgba(230,230,230,0.95); text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.5" data-width="1080" data-height="1920">
      <div id="glow" class="clip" data-start="0" data-duration="14.5" data-track-index="0"></div>

      <div id="kicker" class="kicker clip" data-start="0.2" data-duration="14" data-track-index="1">Old Money Code &middot; Rule 01</div>
      <div id="kicker-rule" class="kicker-rule clip" data-start="0.2" data-duration="14" data-track-index="1"></div>

      <div id="b0" class="beat clip" data-start="0" data-duration="2.4" data-track-index="2">The rich don't work for <span class="em">money.</span></div>
      <div id="b1" class="beat clip" data-start="2.4" data-duration="3.6" data-track-index="2">They buy <span class="em">time</span> &mdash; and time buys everything else.</div>
      <div id="b2" class="beat clip" data-start="6.0" data-duration="5.0" data-track-index="2">One rule. No noise. Just <span class="em">quiet,</span> compounding wealth.</div>

      <div id="endcard" class="endcard clip" data-start="11.0" data-duration="3.5" data-track-index="2">
        <span class="brand">Old Money Code</span>
        <span class="rule"></span>
        <span class="sub">Quiet wealth &middot; every day</span>
      </div>

      <div id="vignette" class="vignette clip" data-start="0" data-duration="14.5" data-track-index="4"></div>
      <svg id="grain" class="grain clip" data-start="0" data-duration="14.5" data-track-index="4" width="1080" height="1920">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" /></filter>
        <rect width="1080" height="1920" filter="url(#n)" />
      </svg>
      <div id="frame" class="frame clip" data-start="0" data-duration="14.5" data-track-index="4"></div>

      <audio id="voice-0" class="clip" data-start="0" data-duration="1.9" data-track-index="5" src="voice/beat-00.mp3"></audio>
      <audio id="voice-1" class="clip" data-start="2.4" data-duration="3.1" data-track-index="5" src="voice/beat-01.mp3"></audio>
      <audio id="voice-2" class="clip" data-start="6.0" data-duration="4.5" data-track-index="5" src="voice/beat-02.mp3"></audio>
      <audio id="music" class="clip" data-start="0" data-duration="14.5" data-track-index="6" data-volume="0.14" src="assets/luxury-pad-01.mp3"></audio>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });

        function splitWords(sel) {
          const el = document.querySelector(sel);
          const nodes = [];
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) {
              n.textContent.split(/(\s+)/).forEach((t) => {
                if (t.trim()) { const s = document.createElement('span'); s.className = 'w'; s.textContent = t; nodes.push(s); n.parentNode.insertBefore(s, n); }
                else if (t) { n.parentNode.insertBefore(document.createTextNode(' '), n); }
              });
              n.remove();
            } else if (n.nodeType === 1) { n.classList.add('w'); nodes.push(n); }
          });
          return nodes;
        }
        const words = [splitWords('#b0'), splitWords('#b1'), splitWords('#b2')];
        words.forEach((ws) => gsap.set(ws, { opacity: 0, y: 46 }));

        // ambient glow drift (seek-safe: driven by the paused timeline)
        tl.fromTo('#glow', { x: 0, y: 0 }, { x: 160, y: -220, duration: 14.5, ease: 'none' }, 0);

        // kicker entrance
        tl.fromTo('.kicker', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 0.2);
        tl.fromTo('.kicker-rule', { scaleX: 0, transformOrigin: 'left center' }, { scaleX: 1, duration: 0.8, ease: 'power2.out' }, 0.45);

        // beat word reveals
        tl.to(words[0], { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out', stagger: 0.07 }, 0.15);
        tl.to(words[1], { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out', stagger: 0.07 }, 2.55);
        tl.to(words[2], { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out', stagger: 0.06 }, 6.15);

        // end card
        tl.fromTo('.endcard', { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'power2.out' }, 11.0);
        tl.fromTo('.endcard .rule', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power2.inOut' }, 11.35);

        window.__timelines = window.__timelines || {};
        window.__timelines['main'] = tl;
        tl.seek(0);
      </script>
    </div>
  </body>
</html>
